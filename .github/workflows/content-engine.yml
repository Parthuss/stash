# Skwirl content engine: publish approved posts on time, then measure them. Code: promo/engine/.
# Off until Parth sets the repo variable ENGINE_ENABLED=1 (gh variable set ENGINE_ENABLED --body 1).
# This repo is public, so its Actions logs are public too: the engine only prints post ids and states.
name: content-engine

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # tick: Telegram taps + publish what's due (off the hour: fewer dropped runs)
    - cron: "41 3 * * *"           # insights: 09:11 IST daily
  workflow_dispatch:
    inputs:
      command:
        description: "tick, insights or queue"
        default: tick
        type: choice
        options: [tick, insights, queue]
      dry_run:
        description: "Dry run (never call the publishing APIs)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    if: vars.ENGINE_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # tick and insights get separate groups, so a queued tick never replaces the daily insights run
    concurrency:
      group: content-engine-${{ github.event.schedule == '41 3 * * *' && 'insights' || (inputs.command || 'tick') }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: promo/engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "httpx>=0.27" "boto3>=1.34"
      - name: Run
        working-directory: promo/engine
        env:
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE }}
          ENGINE_DRY_RUN: ${{ inputs.dry_run && '1' || vars.ENGINE_DRY_RUN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TG_ENGINE_BOT_TOKEN: ${{ secrets.TG_ENGINE_BOT_TOKEN }}
          TG_OWNER_CHAT_ID: ${{ secrets.TG_OWNER_CHAT_ID }}
          TG_OWNER_USER_ID: ${{ secrets.TG_OWNER_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          MEDIA_PUBLIC_BASE: ${{ vars.MEDIA_PUBLIC_BASE }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then cmd="${{ inputs.command }}";
          elif [ "${{ github.event.schedule }}" = "41 3 * * *" ]; then cmd=insights; else cmd=tick; fi
          python -m content_engine "$cmd"
