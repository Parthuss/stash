# Cloud runner: drains other people's saves so the pilot doesn't need the owner's
# Mac awake. The owner's own saves stay local-first (the Mac daemon claims those).
#
# The public run reports only processor counts and status. Configure
# STASH_WORKER_URL, STASH_PROCESSOR_SECRET and GROQ_API_KEY (or GROQ_API_KEYS)
# in Actions secrets.
#
# Limits: GitHub cron can't go under 5 min and often runs late. A run drains
# everything pending, it is not one save per tick.
name: process
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: stash-process
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    # Keep this repository enabled before and after the rename. Forks opt in with STASH_ENABLED.
    if: github.repository == 'Parthuss/stash' || github.repository == 'Parthuss/skwirl-runner' || vars.STASH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q httpx PyYAML yt-dlp sqlite-vec
      # ubuntu-latest no longer ships ffmpeg (transcribe.py needs ffmpeg and ffprobe).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg poppler-utils >/dev/null && ffprobe -version >/dev/null
      - run: python -m stash daemon --once --guests-only --quiet
        env:
          STASH_WORKER_URL: ${{ secrets.STASH_WORKER_URL }}
          STASH_PROCESSOR_SECRET: ${{ secrets.STASH_PROCESSOR_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Unset by default. Only after written platform permission for anonymous
          # access and note retention; ordinary Reddit OAuth approval is insufficient.
          STASH_REDDIT_PUBLIC_ACCESS: ${{ vars.STASH_REDDIT_PUBLIC_ACCESS }}
          STASH_LINKEDIN_PUBLIC_ACCESS: ${{ vars.STASH_LINKEDIN_PUBLIC_ACCESS }}
