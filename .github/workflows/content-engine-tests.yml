name: content-engine-tests
on:
  push:
    paths: ["promo/engine/**", ".github/workflows/content-engine*.yml"]
  pull_request:
    paths: ["promo/engine/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: promo/engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "httpx>=0.27" pytest pillow
      - run: python -m pytest promo/engine/tests -q
