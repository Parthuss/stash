[project]
name = "stash"
version = "0.1.0"
description = "Instagram capture -> enriched vault -> Claude auto-recall"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    # Hybrid search (stash/db.py, stash/embed.py). Core, not optional: search
    # quality is the actual point of this project, not a nice-to-have layered
    # on top of it. Both stay lightweight on purpose — sqlite-vec has zero
    # dependencies of its own, and fastembed pulls onnxruntime but never
    # PyTorch. Runtime degrades to keyword-only search if either is somehow
    # unavailable (a broken sqlite3 build, an offline first run before the
    # model downloads); this is a belt, not the only thing holding it up.
    "sqlite-vec>=0.1.9",
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
local-whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
stash = "stash.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
